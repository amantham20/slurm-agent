[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slurm-doctor"
version = "0.1.0"
description = "Autonomous diagnostician for failed SLURM jobs"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
test = ["pytest>=7"]

[project.scripts]
slurm-doctor = "slurm_doctor.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["slurm_doctor*"]

[tool.setuptools.package-data]
slurm_doctor = ["rules/*.yaml", "hooks/*.sh"]
