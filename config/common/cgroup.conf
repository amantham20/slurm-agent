###
#
# Slurm cgroup support configuration file
#
# See man slurm.conf and man cgroup.conf for further
# information on cgroup configuration parameters
#--
ConstrainCores=no
ConstrainDevices=no
ConstrainRAMSpace=no
ConstrainSwapSpace=no
IgnoreSystemd=yes
IgnoreSystemdOnFailure=yes
# Nested-Docker / cgroup-v1-hybrid hosts (no name=systemd hierarchy) make
# slurmd's cgroup autodetect fail with "can't stat /sys/fs/cgroup/systemd/".
# Proctrack is linuxproc and TaskPlugin is task/affinity, so the cgroup plugin
# is not required; disable it so slurmd can start.
CgroupPlugin=disabled
