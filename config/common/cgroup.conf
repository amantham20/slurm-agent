###
#
# Slurm cgroup support configuration file
#
# See man slurm.conf and man cgroup.conf for further
# information on cgroup configuration parameters
#--
ConstrainCores=no
ConstrainDevices=no
ConstrainRAMSpace=no
ConstrainSwapSpace=no
IgnoreSystemd=yes
IgnoreSystemdOnFailure=yes
# Containers on cgroup-v1 hosts without a systemd hierarchy cannot init the
# cgroup plugin; nothing here needs it (proctrack/linuxproc, task/affinity,
# jobacct_gather/linux), so disable it outright.
CgroupPlugin=disabled
